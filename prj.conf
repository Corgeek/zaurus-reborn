CONFIG_DISPLAY=y
CONFIG_INPUT=y
# LVGL draws on the main thread: about 4.2 kB at peak, measured on QEMU
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_40=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y

# main.c turns the display to landscape before LVGL reads its resolution
CONFIG_LV_Z_AUTO_INIT=n
