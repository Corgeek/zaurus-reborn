CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_LOG=y

# Text on the LCD, landscape as the clamshell is normally held. The LCD
# shows the beacon list only; log output goes to the UART.
CONFIG_DRV_TERM=y
CONFIG_DRV_TERM_ROTATION=90
CONFIG_DRV_TERM_LOG_BACKEND=n

# USB host with the Bluetooth dongle (zephyr,bt-hci-usbh in app.overlay)
CONFIG_USB_HOST_STACK=y
CONFIG_USBH_LOG_LEVEL_WRN=y
CONFIG_UHC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_DRV_USBH=y

# Scan only: no connections, no advertising
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_SVC_BEACON=y

# Holding the power key powers off
CONFIG_SVC_POWER=y
