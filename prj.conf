CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_LOG=y

# Text on the LCD, landscape as the clamshell is normally held
CONFIG_DRV_TERM=y
CONFIG_DRV_TERM_ROTATION=90

# Shell on the LCD, typed on the keyboard; output is also copied to the UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_DRV_SHELL=y
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=64
CONFIG_SHELL_DEFAULT_TERMINAL_HEIGHT=30
CONFIG_SHELL_VT100_COLORS=n

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_DEVICE_SHELL=y

# "input dump on" logs every key and switch event
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y

# Holding the power key or "poweroff" powers off, "kernel reboot cold" reboots
CONFIG_SVC_POWER=y
CONFIG_REBOOT=y

# USB host with the Bluetooth dongle (zephyr,bt-hci-usbh in app.overlay).
# Bluetooth starts at boot; without a dongle, the HCI transport gives up
# every 5 seconds and is opened again, as in the usbh_ble_beacon sample.
CONFIG_USB_HOST_STACK=y
CONFIG_USBH_LOG_LEVEL_WRN=y
CONFIG_UHC_DRIVER_LOG_LEVEL_WRN=y
# The hub and dongle information and the Bluetooth version come up after
# the prompt and would push it away: warnings and errors only
CONFIG_USBH_HUB_LOG_LEVEL_WRN=y
CONFIG_USBH_BT_HCI_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y
CONFIG_DRV_USBH=y

# "ble beacon" shows the BLE beacons around, like top; q goes back.
# Scan only: no connections, no advertising
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
# Controllers put several advertising reports in one event, up to the
# 255 bytes HCI allows: room for that, or the events are dropped
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_SVC_BEACON=y
