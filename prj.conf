CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_LOG=y

# Text on the LCD, landscape as the clamshell is normally held
CONFIG_DRV_TERM=y
CONFIG_DRV_TERM_ROTATION=90

# Shell on the LCD, typed on the keyboard; output is also copied to the UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_DRV_SHELL=y
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=64
CONFIG_SHELL_DEFAULT_TERMINAL_HEIGHT=30
CONFIG_SHELL_VT100_COLORS=n

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_DEVICE_SHELL=y

# "input dump on" logs every key and switch event
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y

# Holding the power key or "poweroff" powers off, "kernel reboot cold" reboots
CONFIG_SVC_POWER=y
CONFIG_REBOOT=y
